# scheduler-facts.conf — QUALI PROGRAMMI PARLANO DELLO SCHEDULER.
#
# I quattro documenti sullo scheduler (il riquadro «I QUATTRO DOCUMENTI» in
# docs/stato-lavori.md) citano dei numeri. La prima regola di costruzione e' che
# i numeri stanno in UN POSTO SOLO, con scritto come sono stati ottenuti, e che
# dove si puo' quel posto si GENERA dalla build invece di scriverlo a mano: e'
# la mossa di marks.conf applicata alla prosa.
#
# Questo file e' la meta' che una macchina non puo' dedurre: QUALI programmi
# sono in argomento. Tutto il resto -- il .vx, gli argomenti della macchina, i
# valori attesi dichiarati, le istruzioni, i cicli, l'occupazione per task -- lo
# sa gia' il build, e tools/scheduler_facts.py glielo chiede invece di ripeterlo.
#
# --- IL CRITERIO, PERCHE' UN ELENCO SENZA CRITERIO SI RIEMPIE DA SOLO ---
#
# Lo scopo dei quattro documenti e' LO SCHEDULER, non il progetto. Entra qui un
# programma che esercita una decisione dello scheduler -- chi gira, quando
# cambia mano la CPU, cosa succede a chi aspetta -- e non ci entra un programma
# che prova una struttura dati, un device o la toolchain, per quanto bello sia.
#
# Percio' NON ci sono: queue, pool, timeout (strutture generiche), kbd (un
# device), proc/include/epsw/ifdef_off/ifdef_on (l'assembler), saxpy/multi e i
# tredici di standalone/ (la macchina vettoriale, che con lo scheduler non si e'
# ancora incontrata se non in vectors).
#
# --- FORMATO ---
#
#   program <nome del test in ctest>
#
# Il nome e' quello di ctest e non il percorso del .vx: e' la chiave con cui il
# build sa rispondere anche sugli argomenti e sui valori attesi. Un nome che
# ctest non conosce e' un errore rumoroso, non una riga saltata.

program scheduler     # le priorita' statiche e la rotazione fra pari
program block         # il blocco volontario, e l'idle che gira mentre uno dorme
program chain         # A->B->C: la catena, e la saturazione
program mailbox       # l'attesa sul mondo
program semaphore     # l'attesa su una risorsa
program mutex         # il priority ceiling, e le due storie di §13.5
program tmgr          # il primo task di sistema: §8, §9 e §10 sotto lo scheduler
program coop          # lo scheduler SENZA il tick: nessun interrupt, IE = 0
program events        # lo scheduler guidato dal mondo, e task_yield
program vectors       # il contesto vettoriale attraverso la commutazione

# marks.conf — IL CATALOGO DELLE MISURE, e l'unica dichiarazione di ognuna.
#
# Il marcatore (hal/marker.vinc) mette sul bersaglio dei NUMERI: un canale, che e'
# un indirizzo, e un valore. I nomi stanno qui, che e' come sono fatti SystemView
# di SEGGER e i metadata stream di CTF/LTTng -- il bersaglio non deve pagare le
# stringhe, e una sw con due numeri costa quello che costa.
#
# --- PERCHE' QUESTO FILE E' LA SORGENTE, E NON UNA TABELLA A LATO ---
#
# Il modo naturale di sbagliare e' tenere due dichiarazioni dello stesso fatto:
# gli .equ nel .vasm e i nomi qui. Divergono in silenzio, e lo strumento disegna
# il nome sbagliato sui dati giusti -- che e' peggio di nessun nome.
#
# Non e' un timore teorico: il 12/09/2026 tools/trace.template.html ha smesso
# di disegnare un task intero perche' ORDINE era un elenco di nomi scritto a
# mano che la realta' si era lasciata indietro. Stessa famiglia di MAILBOX.count,
# che e' un .equ DERIVATO da TESTA.count e non una copia (mailbox.vinc lo
# argomenta per esteso).
#
# Quindi: questo file e' la sorgente, e il .vinc con gli .equ viene GENERATO da
# tools/marks.py. Lo stesso file lo rilegge il lettore per i nomi. Una sorgente,
# due consumatori, e divergere diventa impossibile invece che vietato.
#
# --- FORMATO ---
#
#   names     SIMBOLO canale "cosa sono i valori di questo canale"
#   name      SIMBOLO id     "nome visualizzato"
#   category  SIMBOLO canale "nome" [owner task|kernel|isr] [data "nome"]
#   event     SIMBOLO canale "nome" [owner task|kernel|isr] [data "nome"]
#   marker    SIMBOLO valore "nome"
#
# category = FINESTRE (un valore != 0 apre, 0 chiude: si misura una DURATA).
# event    = PUNTUALI (un valore e basta: la cosa non dura, e' un istante).
#
# `owner` dichiara CHI esegue la sw, e quindi che rapporto ha la marca con
# `current` -- che non e' lo stesso per tutti i canali:
#
#   task    la esegue il task:   current l'ha PRODOTTA
#   kernel  la esegue il kernel: current e' chi PER CONTO DEL QUALE gira (o,
#           per una preemption, chi l'ha SUBITA)
#   isr     la esegue l'ISR:     current e' chi e' stato INTERROTTO
#
# Senza, il lettore sarebbe costretto a una frase buona per tutti -- "girava X"
# -- che descrive il possesso della CPU e non la paternita'. E la macchina lo
# VERIFICA: registra la profondita' di trap, che sa esatta perche' e' lei a
# prendere la trap, quindi un canale `owner isr` che marca in contesto di task
# e' un tag nel posto sbagliato, e si dice. Default: task.
#
# `data` dichiara che ogni marca su quel canale si porta dietro un VALORE DEL
# PROGRAMMA, armato sul porto MARKD_<SIMBOLO> prima della marca. Ne esce un
# .equ in piu', e il lettore mostra "nome=valore" invece di un numero nudo.
# Dichiararlo serve anche a rendere RUMOROSA la dimenticanza: una marca senza
# il dato che la sua categoria promette e' un errore detto, non uno zero
# plausibile -- e zero e' un valore legittimo.
#
# I marker appartengono alla categoria dichiarata sopra di loro. Ne escono:
#
#   .equ MARK_<SIMBOLO>              l'indirizzo del canale
#   .equ M_<CATEGORIA>_<SIMBOLO>      il valore del marker
#
# Il marker e' qualificato dalla categoria perche' l'assembler ha uno spazio di
# nomi PIATTO: due categorie con un marker "primoStage" collidono, e senza
# qualificazione la seconda vincerebbe in silenzio.
#
# I canali 0 e 1 sono RISERVATI alla macchina (esecuzione e device) e non si
# dichiarano qui: chi li scrive e' il simulatore, e la registrazione se li porta
# dietro nella propria intestazione. Dichiararli sarebbe la seconda verita' che
# questo file esiste per evitare.

# --- LE CATEGORIE DEL KERNEL ---
# Stanno dentro il kernel, quindi esistono solo nella configurazione MARKS
# (`.ifdef MARKS`, §3.44): senza, il kernel non le porta e i suoi numeri sono
# quelli puliti. Vedi `vasm_config(marks ...)` in cmake/vasm.cmake.
#
# SCHED e' la prima, ed e' una DOMANDA precisa: quanto ci mette lo scheduler a
# scegliere chi gira. La finestra si apre all'ingresso di `scheduler` e si
# chiude quando la scansione ha finito -- non copre il prologo ne' l'epilogo,
# perche' la domanda e' sulla POLITICA, non sulla chiamata.
#
# --- IL NOME E' QUALIFICATO, E NON E' PIGNOLERIA (14/09/2026, §3.62) ---
# Si chiamava "la scelta di chi gira", e quel nome rivendicava troppo: `scheduler`
# NON e' l'unico posto dove si sceglie. Il percorso preemptivo non ci passa --
# va per `sched_preempt`, che ha una scansione sua e non e' tagliata -- quindi su
# test_tmgr_marks questo numero conta 18 scansioni e ne ignora altre 11, una per
# ogni preemption. Un'etichetta non qualificata faceva leggere "scegliere costa
# 118 cicli", che e' falso: di quel percorso li' dentro non c'e' niente.
#
# `scheduler:` apre uno SPAZIO DI NOMI, e la qualificazione dopo i due punti dice
# quale strada. Il giorno che si tagga sched_preempt la gemella si chiama da se'
# -- "scheduler: preemption" -- e le due corsie si leggono come una coppia
# invece che come due cose scollegate.
#
# "volontaria" e' il vocabolario gia' in uso: e' il BLOCCO VOLONTARIO, cioe' il
# task che lascia la CPU per sua iniziativa (task_block, task_yield), contro
# quello a cui viene tolta.
category  SCHED  4 "scheduler: cessione volontaria"  owner kernel
marker    SCAN   1 "scansione dei livelli"

# PREEMPT e' un EVENT e non una category, ed e' la prima del progetto: una
# preemption e' un ISTANTE, non una durata. Il valore si scrive e basta -- non
# c'e' niente da chiudere -- quindi costa tre istruzioni e nessuna chiusura.
#
# Vale la pena sapere PERCHE' e' un fatto letto e non dedotto. Il diagramma di
# tools/trace.py mostra che la CPU ha cambiato mano, mai PERCHE': un task che
# si blocca da solo e uno a cui la CPU e' stata tolta escono uguali. Dedurlo
# dalla traccia del pc non si puo' -- la fascia di un task che chiama `receive`
# contiene `_trap_entry` tanto quanto quella di uno preemptato, perche' in quei
# cicli di kernel un tick e' passato lo stesso (verificato su test_tmgr il
# 13/09). Il fatto invece esiste, e' del kernel, e sta in UN punto solo:
# `sp_preempted` in scheduler.vasm e' l'unico posto che RIEMPIE uno slot
# PCB.preempted -- gli altri tre lo svuotano. Un tag li' e' esatto.
#
# Chi e' stato preemptato non si dichiara qui: la registrazione porta gia'
# `current` nella quarta colonna di ogni marca, e chi ha preso la CPU dopo lo
# dice il canale 0. Dichiararlo sarebbe la solita seconda verita'.
event     PREEMPT 5 "preemption"                  owner kernel
marker    CUT     1 "la CPU e' stata tolta"

# LATENCY e' IL numero che un lettore realtime cerca per primo, ed e' l'unica
# finestra del progetto che nasce in una routine e muore in un'altra.
#
# --- COSA MISURA, E COSA NON E' ---
# Il ritardo fra "qualcuno di piu' prioritario e' PRONTO" e "GIRA". Non e' il
# tempo fuori CPU che PREEMPT lascia calcolare: quello e' la conseguenza sulla
# vittima -- quanto e' stata tenuta fuori -- mentre questo e' il debito del
# KERNEL verso chi aspetta. Sono due numeri diversi sulla stessa commutazione, e
# un documento che li confondesse direbbe che il kernel e' lento quanto il task
# che ha interrotto.
#
# --- I DUE ESTREMI, E PERCHE' STANNO LI' ---
# Apre `task_ready_preempt`, che e' l'unico punto in cui il kernel constata
# "questo batte chi gira": una riga sotto la blt sui puntatori che §7.3 rende
# possibile. Chiude il `dispatcher`, DOPO il commit di `current`, perche' il
# dispatcher e' per costruzione l'unico punto da cui un task entra in
# esecuzione -- lo dichiara la sua intestazione, ed e' l'invariante che rende
# "gira" un istante e non un'opinione. La finestra ATTRAVERSA quindi la
# commutazione, che e' precisamente cio' per cui il marcatore esiste.
#
# --- PERCHE' SERVE UNA PAROLA DI STATO (g_lat_open) ---
# Il dispatcher gira a OGNI uscita da trap, anche senza switch, mentre la
# finestra si apre solo sulle preemption: chiudere incondizionatamente
# significherebbe chiudere un canale mai aperto, che il lettore dichiara errore
# -- a ragione. Il flag e' la domanda "ce n'e' una aperta?" resa leggibile dal
# dispatcher, e vive dentro .ifdef MARKS: nella build pulita non esiste.
#
# La strada che sembrava piu' economica -- chiudere sul ramo di g_resched in
# sched_isr_exit, che e' gia' condizionale -- e' SBAGLIATA, ed e' un fatto
# verificabile: request_preempt e' .global e la chiamano anche mutex_unlock e
# due test SENZA passare da task_ready. Li' g_resched si arma senza che nessuna
# finestra sia aperta, e ogni chiusura sarebbe su un canale chiuso.
#
# --- SU test_tmgr IL LETTORE STAMPA UN ERRORE, ED E' GIUSTO COSI' ---
# "canale 7 aperto al ciclo 49705 e MAI CHIUSO". Non e' un difetto del tag: al
# dodicesimo tick tmgr_tick sveglia il gestore -- quindi APRE -- e l'ISR del test
# fa halt senza passare da sched_isr_exit, cosi' la corsa finisce con qualcuno
# pronto e mai messo a girare. Quella latenza non ha un secondo estremo e il
# lettore dice che la misura non c'e', che e' l'unica cosa vera da dire.
#
# Quindi il controllo di consistenza si fa sulle CHIUSURE (11, una per ognuna
# delle 11 preemption), non sulle aperture (12). Vedi §6.1 di
# docs/scheduler-facts.md, dove la tabella delle tre righe sta per esteso.
category  LATENCY 7 "latenza di preemption"       owner kernel
marker    READY   1 "pronto, non ancora in esecuzione"

# --- LA CATEGORIA DELL'HAL, E PERCHE' E' SUA (14/09/2026, §3.63) ---
# LATENCY chiude nel dispatcher, prima di `call ctx_restore`. Ma fra quella
# chiusura e la prima istruzione del task passano ancora 153 cicli -- undici
# volte su undici -- e sono il ripristino dei registri. Il numero realtime vero
# non e' 169: e' 322.
#
# IL KERNEL NON PUO' MISURARLI. `ctx_restore` NON RITORNA: cede il controllo al
# task e la pila non torna indietro, quindi non esiste un'istruzione di kernel
# dopo il ripristino su cui mettere una chiusura. Non e' una scelta di comodo,
# e' la forma del codice.
#
# Da cui: l'HAL misura l'HAL, con una categoria SUA. Non e' il kernel che
# allunga un tag dentro lo strato di sotto -- quello saprebbe cosa misura
# quello di sopra -- ma lo strato di sotto che dichiara il proprio costo. Il
# marcatore e' gia' roba dell'HAL: il porto sta in hal/marker.vinc, e il
# generato lo include. Nella build PULITA l'HAL resta a zero dipendenze e le
# impronte lo dimostrano.
#
# I DUE ESTREMI: apre all'ingresso di `ctx_restore` e chiude A RIDOSSO DELLA
# `reti`. Fino al 14/09 la chiusura stava sette istruzioni piu' su, perche' una
# marca voleva un registro d'appoggio e li' non ce n'e' piu' uno libero: la
# finestra si chiudeva 11 cicli prima che il task eseguisse. Con `mark`, che non
# tocca registri (§3.66), resta fuori UN CICLO SOLO -- la `reti` stessa, che dal
# software non si puo' prendere: non esiste un'istruzione di kernel dopo la
# consegna. Si dichiara invece di inseguirla.
# --- L'OWNER E' `kernel`, E LO ERA GIA' QUANDO HO SCRITTO `task` ---
# Il ripristino lo esegue l'HAL, non il task: `current` e' quello PER CONTO DEL
# QUALE gira -- cioe' l'entrante, gia' committato dal dispatcher -- che e'
# esattamente la definizione di `owner kernel` piu' su.
#
# Dichiarato `task` fino al 14/09/2026, e il lettore lo diceva a ogni corsa:
# "dichiara owner task ma questa marca e' stata prodotta DENTRO una trap".
# Ventidue volte su test_tmgr_marks. La dichiarazione sbagliata non falsava un
# numero -- le finestre restano quelle -- ma rendeva rumorosa la sezione ERRORI,
# che e' il modo piu' rapido per insegnare a qualcuno a non leggerla.
#
# `kernel` non vincola il contesto di trap, e deve essere cosi': il ripristino
# gira DENTRO una trap quando la commutazione viene da un interrupt e FUORI
# quando viene da un blocco volontario. Sono lo stesso codice nelle due
# situazioni, ed e' una proprieta' del dispatcher, non un'incoerenza.
category  HALSW  8 "hal: ripristino del contesto"  owner kernel
marker    LOAD   1 "montaggio dei registri"

# --- UNA CATEGORIA CHE PORTA UN DATO ---
# `data "codice"` dichiara che su questo canale ogni marca si porta dietro un
# valore del programma, armato sul porto MARKD_RECV. Il lettore lo mostra come
# "codice=77" invece che come un numero nudo -- e una marca che arriva SENZA
# quel dato e' un errore DETTO, non uno zero plausibile: zero e' un codice di
# messaggio legittimo, quindi senza la dichiarazione non si distinguerebbe da
# "mi sono dimenticato di armare".
#
# Il tag sta nell'APPLICAZIONE e non in `receive`, ed e' una scelta di strato:
# message.vinc dichiara che la testa del payload e' convenzione fra clienti e
# fornitori e che il kernel non ne legge un byte. Un tag dentro receive che
# leggesse PAYLOAD.messageCode farebbe cominciare la mailbox a dipendere da
# quella convenzione -- nella sola configurazione strumentata, ma comunque. Chi
# i codici li conosce e' chi li ha chiesti.
event     RECV    6 "messaggio ricevuto"          owner task   data "codice"
marker    GOT     1 "consegnato dalla mailbox"

# --- I NOMI DEI TASK ---
# Il canale 0 porta indirizzi di TCB, e un indirizzo non ha un nome finche'
# qualcuno non glielo da'. Il programma lo REGISTRA a runtime -- tre istruzioni
# una volta sola, dentro .ifdef MARKS -- e qui sta la traduzione id -> nome.
#
# Le due strade scartate: `.global` sui TCB (il nome verrebbe dalla tabella dei
# simboli, che esiste solo se la toolchain la pubblica e lo strumento sa
# leggerla) e un campo dentro il TCB (che dentro .ifdef farebbe valere TCB.size
# 24 in una configurazione e 28 nell'altra, con il linker che non se ne
# accorge; e fuori da .ifdef lo pagherebbe ogni programma con task).
#
# La registrazione invece nella build pulita NON ESISTE: zero byte, zero
# impronte mosse. E' come fa SystemView, che i nomi li manda una volta a inizio
# corsa e mai piu'.
names  EXEC  0 "chi possiede la CPU"
name   A     1 "A"
name   IDLE  2 "idle"
name   TMGR  3 "gestore"

# I tre di test_mondo (§3.69). I nomi stanno QUI e non nel programma: il
# programma registra un ID, e i nomi da mostrare vivono in un posto solo --
# altrimenti due corse dello stesso sistema potrebbero chiamare le stesse cose
# con nomi diversi.
name   TASTO 4 "K (tasto)"
name   CONTA 5 "C (contatore)"
name   STAMP 6 "P (stampa)"

# Spostata dal canale 2 il 15/09/2026: quello e' passato alla MACCHINA, che ci
# marca la richiesta di interruzione del timer. Il sorgente non se n'e' accorto
# -- test_events dice MARK_WAIT, che e' un .equ GENERATO da questa riga -- ed e'
# precisamente il motivo per cui questo file e' la sorgente e il .vinc non si
# scrive a mano. Nessun EXPECT si e' mosso: `mark` resta un'istruzione sola, e
# il canale e' un immediato.
category  WAIT   9 "attesa del mondo"
marker    POLLING  1 "guarda il flag della tastiera"

category  RESPONSE 3 "risposta al tasto"
marker    DELIVERY 1 "letto, non ancora sommato"

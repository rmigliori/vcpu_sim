# marks.conf — IL CATALOGO DELLE MISURE, e l'unica dichiarazione di ognuna.
#
# Il marcatore (hal/marker.vinc) mette sul bersaglio dei NUMERI: un canale, che e'
# un indirizzo, e un valore. I nomi stanno qui, che e' come sono fatti SystemView
# di SEGGER e i metadata stream di CTF/LTTng -- il bersaglio non deve pagare le
# stringhe, e una sw con due numeri costa quello che costa.
#
# --- PERCHE' QUESTO FILE E' LA SORGENTE, E NON UNA TABELLA A LATO ---
#
# Il modo naturale di sbagliare e' tenere due dichiarazioni dello stesso fatto:
# gli .equ nel .vasm e i nomi qui. Divergono in silenzio, e lo strumento disegna
# il nome sbagliato sui dati giusti -- che e' peggio di nessun nome.
#
# Non e' un timore teorico: il 12/09/2026 tools/trace.template.html ha smesso
# di disegnare un task intero perche' ORDINE era un elenco di nomi scritto a
# mano che la realta' si era lasciata indietro. Stessa famiglia di MAILBOX.count,
# che e' un .equ DERIVATO da TESTA.count e non una copia (mailbox.vinc lo
# argomenta per esteso).
#
# Quindi: questo file e' la sorgente, e il .vinc con gli .equ viene GENERATO da
# tools/marks.py. Lo stesso file lo rilegge il lettore per i nomi. Una sorgente,
# due consumatori, e divergere diventa impossibile invece che vietato.
#
# --- FORMATO ---
#
#   category  SIMBOLO canale "nome visualizzato"
#   marker    SIMBOLO valore "nome visualizzato"
#
# I marker appartengono alla categoria dichiarata sopra di loro. Ne escono:
#
#   .equ MARK_<SIMBOLO>              l'indirizzo del canale
#   .equ M_<CATEGORIA>_<SIMBOLO>      il valore del marker
#
# Il marker e' qualificato dalla categoria perche' l'assembler ha uno spazio di
# nomi PIATTO: due categorie con un marker "primoStage" collidono, e senza
# qualificazione la seconda vincerebbe in silenzio.
#
# I canali 0 e 1 sono RISERVATI alla macchina (esecuzione e device) e non si
# dichiarano qui: chi li scrive e' il simulatore, e la registrazione se li porta
# dietro nella propria intestazione. Dichiararli sarebbe la seconda verita' che
# questo file esiste per evitare.

# --- LE CATEGORIE DEL KERNEL ---
# Stanno dentro il kernel, quindi esistono solo nella configurazione MARKS
# (`.ifdef MARKS`, §3.44): senza, il kernel non le porta e i suoi numeri sono
# quelli puliti. Vedi `vasm_config(marks ...)` in cmake/vasm.cmake.
#
# SCHED e' la prima, ed e' una DOMANDA precisa: quanto ci mette lo scheduler a
# scegliere chi gira. La finestra si apre all'ingresso di `scheduler` e si
# chiude quando la scansione ha finito -- non copre il prologo ne' l'epilogo,
# perche' la domanda e' sulla POLITICA, non sulla chiamata.
category  SCHED  4 "la scelta di chi gira"
marker    SCAN   1 "scansione dei livelli"

# PREEMPT e' un EVENT e non una category, ed e' la prima del progetto: una
# preemption e' un ISTANTE, non una durata. Il valore si scrive e basta -- non
# c'e' niente da chiudere -- quindi costa tre istruzioni e nessuna chiusura.
#
# Vale la pena sapere PERCHE' e' un fatto letto e non dedotto. Il diagramma di
# tools/trace.py mostra che la CPU ha cambiato mano, mai PERCHE': un task che
# si blocca da solo e uno a cui la CPU e' stata tolta escono uguali. Dedurlo
# dalla traccia del pc non si puo' -- la fascia di un task che chiama `receive`
# contiene `_trap_entry` tanto quanto quella di uno preemptato, perche' in quei
# cicli di kernel un tick e' passato lo stesso (verificato su test_tmgr il
# 13/09). Il fatto invece esiste, e' del kernel, e sta in UN punto solo:
# `sp_preempted` in scheduler.vasm e' l'unico posto che RIEMPIE uno slot
# PCB.preempted -- gli altri tre lo svuotano. Un tag li' e' esatto.
#
# Chi e' stato preemptato non si dichiara qui: la registrazione porta gia'
# `current` nella quarta colonna di ogni marca, e chi ha preso la CPU dopo lo
# dice il canale 0. Dichiararlo sarebbe la solita seconda verita'.
event     PREEMPT 5 "preemption"
marker    CUT     1 "la CPU e' stata tolta"

category  WAIT   2 "attesa del mondo"
marker    POLLING  1 "guarda il flag della tastiera"

category  RESPONSE 3 "risposta al tasto"
marker    DELIVERY 1 "letto, non ancora sommato"
